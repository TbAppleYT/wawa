services:
  - type: web
    name: eas-webdec-test
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "8080"
    disk:
      name: station-data
      mountPath: /data
      sizeGB: 1
